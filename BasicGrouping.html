<!DOCTYPE html>
<html>
<head>
  <title>Basic Grouping</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .main {
      border: 2px solid rgb(0, 0, 0);
      padding: 30px;
    }

    .header {
      background: rgb(24, 133, 31);
      padding: 100px;
      margin-bottom: 100px;
    }

    .content {
      background: rgb(51, 12, 192);
      padding: 100px;
    }

    .box {
      background: white;
      border: 1px solid rgb(210, 162, 162);
      padding: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="header">
     <h1> My Page</h1>
    </div>

    <div class="content">
      <div class="box">
        <h2>Box 1</h2>
        <p>Hello this is my First Box.</p>
      </div>

      <div class="box">
        <h2>Box 2</h2>
        <p>Hello this is my Second Box.</p>
      </div>
    </div>
  </div>

</body>
</html>
